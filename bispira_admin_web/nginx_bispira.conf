# ==============================================================================
# Nginx Reverse Proxy Configuration for BISPIRA Backend (Next.js)
# File target on server: /etc/nginx/sites-available/bispira
# ==============================================================================

server {
    listen 80;
    server_name api.bispira.id bispira.id 145.79.15.101; # Ganti dengan domain / IP Anda

    client_max_body_size 50M;

    # Gzip Compression untuk performa cepat di HP & web
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings untuk background tasks / routing OSRM
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

